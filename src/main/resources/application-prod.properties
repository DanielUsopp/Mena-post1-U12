# src/main/resources/application-prod.properties
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${DATASOURCE_USER:appuser}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.universidad=INFO

# Las tablas se crean con schema-postgresql.sql (CREATE TABLE IF NOT EXISTS)
# antes de que Hibernate las valide
spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Sin valor por defecto: en produccion la clave JWT es obligatoria
app.jwt.secret=${JWT_SECRET:}

# Actuator: en prod solo health e info, sin detalles para usuarios anonimos
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
